name: Auto-Update Ebuilds

on:
  schedule:
    - cron: '20 6 * * 0'  # Sunday 06:20 UTC (3h after image build at 03:00)
    - cron: '20 6 * * 3'  # Wednesday 06:20 UTC
  workflow_dispatch:        # allow manual trigger for testing

# Writes to GitHub use the bot token that update-package.yml's publish job
# mints, so the workflow's own token only reads.
permissions:
  contents: read

jobs:
  list-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: List overlay packages
        id: list
        run: |
          set -euo pipefail
          PACKAGES=$(find . -name "*.ebuild" -not -path "./.git/*" \
            | awk -F/ '{print $2"/"$3}' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  update:
    needs: list-packages
    strategy:
      matrix:
        package: ${{ fromJson(needs.list-packages.outputs.packages) }}
      fail-fast: false
    uses: ./.github/workflows/update-package.yml
    with:
      package: ${{ matrix.package }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
